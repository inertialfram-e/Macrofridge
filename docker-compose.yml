services:
  postgres:
    image: postgres:15-alpine
    container_name: macrofridge-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-macrofridge}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-macrofridge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  powersync:
    image: powersync/service:latest
    container_name: macrofridge-powersync
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POWERSYNC_DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-macrofridge}
      POWERSYNC_CONFIG_PATH: /etc/powersync/powersync.yaml
    volumes:
      - ./powersync.yaml:/etc/powersync/powersync.yaml:ro
    ports:
      - "8080:8080"

volumes:
  postgres_data:
